name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build assets
        run: npm run build

      # الملفات الثلاثة التي تُحمّلها includes/class-admin.php بالاسم.
      # نقصان أي منها = صفحة أدمن فاضية عند المستخدم (حادثة 1.0.0/1.1.0).
      - name: Verify admin bundle matches what class-admin.php enqueues
        run: |
          set -e
          for f in build/index.js build/index.asset.php build/style-index.css; do
            test -s "$f" || { echo "::error::MISSING $f"; exit 1; }
            echo "ok: $f ($(wc -c < "$f") bytes)"
          done

      # إثبات أن build/ ينجو من التغليف: نحاكي rsync الذي يستخدمه
      # 10up/action-wordpress-plugin-deploy مع .distignore.
      - name: Verify build/ survives .distignore packaging
        run: |
          set -e
          mkdir -p /tmp/pkg
          rsync -r --exclude-from=.distignore --exclude='.git/' ./ /tmp/pkg/
          for f in build/index.js build/index.asset.php build/style-index.css; do
            test -s "/tmp/pkg/$f" || { echo "::error::$f excluded from package by .distignore"; exit 1; }
          done
          echo "packaged files: $(find /tmp/pkg -type f | wc -l)"
          find /tmp/pkg/build -type f | sort

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
